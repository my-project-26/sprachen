name: api-test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Geschichten-Zeiten messen
        run: |
          cat > t.py <<'PY'
          import json, time, urllib.request
          S = "https://sprachen-five.vercel.app"
          W = [{"en":e,"de":d} for e,d in [("roundabout","Kreisverkehr"),("sneeze","niesen"),("jealous","eifersüchtig"),("platform","Bahnsteig"),("apologise","sich entschuldigen"),("certain","sicher"),("main course","Hauptgericht"),("appearance","Aussehen"),("receipt","Beleg"),("heating","Heizung")]]
          def post(path, body):
              t = time.time()
              try:
                  r = urllib.request.urlopen(urllib.request.Request(S + path, json.dumps(body).encode(), {"content-type": "application/json"}), timeout=130)
                  d = json.loads(r.read()); code = r.status
              except urllib.error.HTTPError as e:
                  d = {"error": e.read()[:200].decode("utf-8", "replace")}; code = e.code
              except Exception as e:
                  d = {"error": str(e)}; code = 0
              return code, round(time.time() - t, 1), d
          last = None
          for i in range(2):
              c, s, d = post("/api/story", {"words": W, "level": "A2", "lang": "English", "theme": "Krimi"})
              print("KURZ", c, s, "s", len(d.get("text", "").split()), "Wörter", d.get("error", ""), flush=True)
              if d.get("text"): last = d
          for i in range(2):
              c, s, d = post("/api/story", {"sleep": True, "category": "krimi", "level": "A2", "lang": "English", "words": W})
              print("LANG", c, s, "s", len(d.get("text", "").split()), "Wörter", d.get("error", ""), flush=True)
          if last:
              c, s, d = post("/api/decode", {"text": last["text"], "lang": "English"})
              print("DECODE", c, s, "s", d.get("error", ""), flush=True)
          PY
          python3 t.py
