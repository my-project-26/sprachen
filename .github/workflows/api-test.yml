name: api-test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Wortlisten-Schnittstelle testen
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
        run: |
          SIG=$(python3 -c "import hashlib,os;print(hashlib.sha256((os.environ['GOOGLE_TTS_KEY']+':bank').encode()).hexdigest())")
          start=$(date +%s)
          curl -s -m 80 -X POST https://sprachen-five.vercel.app/api/bank -H "content-type: application/json" -H "x-ww-sig: $SIG" \
            -d '{"lang":"fr","rows":[["apple","Apfel","n","A1","essen","I eat an *apple*.","Ich esse einen *Apfel*."],["go","gehen","v","A1","alltag","We *go* home.","Wir *gehen* nach Hause."],["school","Schule","n","A1","bildung","The *school* is big.","Die *Schule* ist groß."]]}' -w "\nHTTP %{http_code}\n"
          echo "Dauer $(( $(date +%s) - start )) s"
